<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Validación con Zod</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/zod@3.21.4/lib/index.umd.min.js"></script>
</head>
<body>
  <h1>Registro de Usuario</h1>

  <form id="registerForm" novalidate>
    <label for="name">Nombre:</label>
    <input type="text" id="name" placeholder="Tu nombre" />
    <p class="field-error" id="nameError"></p>

    <label for="email">Correo Electrónico:</label>
    <input type="email" id="email" placeholder="Tu correo" />
    <p class="field-error" id="emailError"></p>

    <label for="password">Contraseña:</label>
    <input type="password" id="password" placeholder="Contraseña" />
    <p class="field-error" id="passwordError"></p>

    <button type="submit">Registrar</button>

    <p id="formStatus"></p>
  </form>

  <!-- El script debe ir después del formulario para que el DOM ya exista -->
  <script src="script.js" defer></script>
</body>
</html>
