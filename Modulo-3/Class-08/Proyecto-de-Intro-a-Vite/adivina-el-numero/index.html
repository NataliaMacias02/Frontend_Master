<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adivina el número</title>
</head>
<body>
    <div class="contenedor">
        <h1>Adivina el número</h1>
        <p>La computadora ha generado un número entre 1 y 100. ¡Adivínalo!</p>

        <div class="controles">
            <input type="number" id="numero" min="1" max="100" placeholder="Tu número...">
            <button id="adivinar">Adivinar</button>
        </div>

        <p id="mensaje"></p>

        <div class="info">
            <p>Intentos: <span id="intentos">0</span></p>
            <p id="mejorPuntaje"></p>
        </div>

        <button id="reiniciar" class="oculto">Jugar de nuevo</button>
    </div>

    <script type="module" src="/main.js"></script>
</body>
</html>
