<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="bt-wrap">
        <h2 class="sr-only">Seguimiento de libros leídos y por leer</h2>
        <div class="bt-header">
            <p class="bt-title">Mi biblioteca</p>
            <span class="bt-count" id="btCount">0 libros</span>
        </div>

        <div class="bt-form-card">
            <div class="bt-form-row">
                <div class="bt-field">
                    <label class="bt-label">Título</label>
                    <input type="text" id="inTitulo" placeholder="Nombre del libro">
                </div>
                <div class="bt-field">
                    <label class="bt-label">Autor</label>
                    <input type="text" id="inAutor" placeholder="Nombre del autor">
                </div>
            </div>
            <div class="bt-form-row">
                <div class="bt-field">
                    <label class="bt-label">Estado</label>
                    <select id="inEstado">
                        <option value="pendiente">Pendiente</option>
                        <option value="leyendo">Leyendo</option>
                        <option value="leido">Leído</option>
                    </select>
                </div>
                <div class="bt-field">
                    <label class="bt-label">Calificación</label>
                    <select id="inCalif">
                        <option value="">Sin calificación</option>
                        <option value="1">1 — Regular</option>
                        <option value="2">2 — Bien</option>
                        <option value="3">3 — Bueno</option>
                        <option value="4">4 — Muy bueno</option>
                        <option value="5">5 — Excelente</option>
                    </select>
                </div>
            </div>
            <div class="bt-form-row">
                <div class="bt-field full">
                    <label class="bt-label">Comentario</label>
                    <textarea id="inComentario" placeholder="¿Qué opinas del libro? ¿Lo recomendarías?"></textarea>
                </div>
            </div>
            <div class="bt-actions">
                <button class="bt-btn-primary" id="btnAgregar">
                    <i class="ti ti-plus" aria-hidden="true"></i> Agregar libro
                </button>
            </div>
        </div>

        <div class="bt-filters">
            <button class="bt-chip active" data-filter="todos">Todos</button>
            <button class="bt-chip" data-filter="pendiente">Pendientes</button>
            <button class="bt-chip" data-filter="leyendo">Leyendo</button>
            <button class="bt-chip" data-filter="leido">Leídos</button>
        </div>

        <div id="btLista">
            <div class="bt-empty" id="btEmpty">
                <i class="ti ti-books" style="font-size:32px; display:block; margin-bottom:8px" aria-hidden="true"></i>
                Aún no tienes libros. ¡Agrega el primero!
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
